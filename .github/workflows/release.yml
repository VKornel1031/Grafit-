name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v1.0.0)
        required: true
        default: v1.0.4
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GRAFIT_STORE_PASSWORD: ${{ secrets.GRAFIT_STORE_PASSWORD }}
      GRAFIT_KEY_ALIAS: ${{ secrets.GRAFIT_KEY_ALIAS }}
      GRAFIT_KEY_PASSWORD: ${{ secrets.GRAFIT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAFIT_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['KEYSTORE_BASE64', 'GRAFIT_STORE_PASSWORD', 'GRAFIT_KEY_ALIAS', 'GRAFIT_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure the four GRAFIT release-signing secrets before publishing.')
          key = Path(os.environ['RUNNER_TEMP']) / 'grafit-release.p12'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'GRAFIT_KEYSTORE_PATH={key}\n')
          PY
      - name: Build and verify release
        env:
          GRAFIT_RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/build-release.sh
      - name: Retain release diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/release-manifest.json \
            --verify-tag --title "Grafit ${RELEASE_TAG#v}" --notes-file "releases/${RELEASE_TAG#v}.md"
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grafit-release.p12"
